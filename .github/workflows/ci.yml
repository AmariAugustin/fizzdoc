name: CI

# The site deploys itself: Cloudflare Pages builds every push to main (and a preview for each PR).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions → CI → Run workflow: run the tests by hand

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:mcp
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
